# Site Settings
title: "Junteng Liu"
title_separator: "-"
name: &name "Junteng Liu"
description: &description "Personal homepage of Junteng Liu - PhD candidate at HKUST NLP Group"
url: "https://sharebreakerhose.github.io"
baseurl: "/LJT-Homepage"
repository: "https://github.com/sharebreakerhose/LJT-Homepage"
teaser: /images/teaser.png
logo: /images/logo.png

# Site Author
author:
  name      : "Junteng Liu"
  avatar    : "/images/profile.png"
  bio       : "First-year PhD candidate at HKUST NLP Group. Research focuses on natural language processing and machine learning."
  location  : "Hong Kong"
  email     : "jliugi@connect.ust.hk"
  uri       :
  github    : "Vicent0205"
  googlescholar : "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  twitter   : "@junteng88716710"

# Reading Files
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
  teaching:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  posts:
    output: true

# Publication categories - if you use this, the publications page will be divided into sections
publication_category:
  manuscripts:
    title: "Preprints"
  conference:
    title: "Conference Papers"
  workshop:
    title: "Workshop Papers"
  journal:
    title: "Journal Articles"

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      read_time: true
      share: true
      comments: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      share: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: single
      author_profile: true
      share: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true

# Reading Files
include:
  - _pages
exclude:
  - .sass-cache
  - .git
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - docker-compose.yaml
  - Dockerfile
  - _config_docker.yml
  - vendor
  - markdown_generator

# Markdown Processors
markdown: kramdown
highlighter: rouge
lsi: false

# Markdown Processors
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false
  toc_levels: "1..3"

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Plugins (first-party)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-gist
  - jekyll-redirect-from
  - jekyll-include-cache
  - jekyll-relative-links

# SEO
author: *name
description: *description
logo: /images/logo.png

# Social Sharing
twitter:
  username: "@junteng88716710"
og_image: /images/teaser.png
social:
  type:  person
  links:
    - "https://github.com/Vicent0205"
    - "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"

# Analytics
analytics:
  provider: false

# Comments
comments:
  provider: false

# Site Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Vicent0205"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:jliugi@connect.ust.hk"
